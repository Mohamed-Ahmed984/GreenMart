name: GreenMart checks
on:
  push:
  pull_request:
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.10'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Format and apply safe analyzer fixes on development branches
        if: github.event_name == 'push' && github.ref != 'refs/heads/main'
        run: |
          dart fix --apply
          dart format lib test
          if [ -d tool ]; then dart format tool; fi
      - run: flutter analyze
      - run: flutter test
      - run: flutter build web --release
      - name: Capture three README screenshots
        if: github.ref == 'refs/heads/docs/validation-and-screenshots'
        run: flutter test tool/capture_screenshots_test.dart --reporter expanded
      - name: Save validated formatting and generated assets
        if: github.event_name == 'push' && github.ref != 'refs/heads/main'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib test pubspec.lock
          if [ -d tool ]; then git add tool; fi
          if [ -d docs/screenshots ]; then git add docs/screenshots; fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Apply validated formatting and refresh generated assets'
          git push origin "HEAD:$GITHUB_REF_NAME"
