name: flutter_application_13
description: "GreenMart grocery shopping demo with product search and a local basket."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.2.3
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  

flutter:
  uses-material-design: true
  assets:
    - Assets/Image/Logo.svg
    - Assets/Image/Welcome.png
    - Assets/Image/carrot.svg
    - Assets/Icons/store.svg
    - Assets/Icons/heart.svg
   
    
    - Assets/Icons/Explore.svg
    - Assets/Icons/Cart.svg
  fonts:
      - family: Poppins
        fonts:
          - asset: Assets/Fonts/Poppins-Regular.ttf
            weight: 400
          - asset: Assets/Fonts/Poppins-Medium.ttf
            weight: 500
          - asset: Assets/Fonts/Poppins-SemiBold.ttf
            weight: 600

